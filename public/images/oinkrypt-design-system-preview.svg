    <text x="64" y="110" fill="#97979b" font-size="15">Token reference · visual foundations · production components</text>
    <text x="64" y="178" font-size="22" font-weight="700">Brand</text>
    <text x="64" y="210" fill="#9b9ba1" font-size="14">Blue is reserved for primary actions and interactive emphasis.</text>
  </g>
  <g>
