  </g>
  <line x1="64" y1="382" x2="1536" y2="382" stroke="#3a3a3d"/>
  <g fill="#f4f4f5" font-family="Arial, Helvetica, sans-serif"><text x="64" y="430" font-size="22" font-weight="700">Surfaces</text><text x="64" y="462" fill="#9b9ba1" font-size="14">Nested elevation keeps the product quiet and legible.</text></g>
  <rect x="64" y="490" width="760" height="160" rx="10" fill="#171717" stroke="#444448"/><rect x="94" y="520" width="700" height="100" rx="8" fill="#202020"/><rect x="126" y="548" width="636" height="48" rx="6" fill="#2a2a2a"/>
  <g fill="#a5a5aa" font-family="monospace" font-size="13"><text x="82" y="514">surface.base</text><text x="112" y="544">surface.container</text><text x="148" y="578">surface.elevated · example.com — scan #4</text></g>
