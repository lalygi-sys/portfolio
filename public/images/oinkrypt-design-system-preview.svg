<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Oinkrypt design system foundations and components</title>
  <desc id="desc">A dark design system reference page showing brand colours, surfaces, typography, status badges and production controls.</desc>
  <rect width="1600" height="900" fill="#171717"/>
  <g fill="#f4f4f5" font-family="Arial, Helvetica, sans-serif">
